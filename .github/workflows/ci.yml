name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install synapse
        run: pip install synapse

      - name: Install the TextMate engine for the grammar tests
        run: npm install --no-save vscode-textmate vscode-oniguruma

      - name: Grammar tests
        run: ./test/node test/grammar.test.js

      - name: Extension tests
        run: STORM_PYTHON="$(which python)" ./test/node test/extension.test.js
